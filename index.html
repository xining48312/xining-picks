<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同級之選</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-wrap">
      <div class="brand-row">
        <a class="brand" href="index.html">同級之選</a>
        <p class="tagline">把價位相近的款式放在一起，看各自強在哪裡</p>
      </div>
      <div class="categories" aria-label="文章分類">
        <span class="chip purple">全部</span>
        <span class="chip">家電</span>
        <span class="chip">租屋</span>
        <span class="chip">生活</span>
      </div>
    </div>
  </header>
  <main class="wrap home">
    <h1 class="section-title">選購指南</h1>
    <div class="post-grid">
      <article class="card post-card">
        <div class="meta">
          <span class="chip purple">未分類</span>
          <span>日期待定</span>
        </div>
        <h2>文章準備中</h2>
        <p>選購指南正在整理，發布後會在這裡更新。</p>
      </article>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>本站含蝦皮分潤連結，透過連結購買我可能獲得分潤，不影響你的價格</p>
    </div>
  </footer>
</body>
</html>
